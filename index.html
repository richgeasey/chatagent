<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat with Crimson — Pullman Rotary</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1A3A5C;
      --blue: #1A5276;
      --gold: #C9A84C;
      --cream: #F9F6EF;
      --white: #FFFFFF;
      --gray: #6B7280;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--cream);
      font-family: 'Outfit', sans-serif;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse 80% 60% at 10% 20%, rgba(26,82,118,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 90% 80%, rgba(201,168,76,0.05) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: var(--navy);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(14,26,20,0.15);
    }

    .header-logo {
      width: 36px;
      height: 36px;
      background: rgba(201,168,76,0.15);
      border: 1px solid rgba(201,168,76,0.35);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .rotary-wheel {
      width: 22px;
      height: 22px;
    }

    .header-text h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--white);
      line-height: 1.1;
      letter-spacing: 0.01em;
    }

    .header-text p {
      font-size: 11px;
      font-weight: 300;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.05em;
    }

    .header-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.8;
    }

    .online-dot {
      width: 6px;
      height: 6px;
      background: #22C55E;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .chat-container {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .footer {
      background: var(--navy);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border-top: 1px solid rgba(201,168,76,0.1);
    }

    .footer-left {
      font-size: 10px;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.05em;
    }

    .footer-right {
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.05em;
    }

    .footer-right a {
      color: rgba(201,168,76,0.5);
      text-decoration: none;
    }

    .footer-right a:hover {
      color: var(--gold);
    }
  </style>
</head>
<body>

  <div class="wrapper">

    <div class="header">
      <div class="header-logo">
        <svg class="rotary-wheel" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" stroke="#C9A84C" stroke-width="6" fill="none"/>
          <circle cx="50" cy="50" r="28" stroke="#C9A84C" stroke-width="5" fill="none"/>
          <circle cx="50" cy="50" r="10" fill="#C9A84C"/>
          <line x1="50" y1="22" x2="50" y2="40" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
          <line x1="50" y1="60" x2="50" y2="78" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
          <line x1="22" y1="50" x2="40" y2="50" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
          <line x1="60" y1="50" x2="78" y2="50" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
          <line x1="33" y1="33" x2="44" y2="44" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
          <line x1="56" y1="56" x2="67" y2="67" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
          <line x1="67" y1="33" x2="56" y2="44" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
          <line x1="44" y1="56" x2="33" y2="67" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>Crimson — Pullman Rotary Assistant</h1>
        <p>Rotary Club of Pullman, Washington &nbsp;·&nbsp; District 5080</p>
      </div>
      <div class="header-badge">
        <span class="online-dot"></span>
        Online
      </div>
    </div>

    <div class="chat-container" id="retell-widget-container"></div>

    <div class="footer">
      <span class="footer-left">pullmanrotary.org &nbsp;·&nbsp; RotaryPullman@gmail.com</span>
      <span class="footer-right">Powered by <a href="https://talltowndesigns.com" target="_blank">Tall Town Design</a></span>
    </div>

  </div>

  <script
    src="https://cdn.retellai.com/retell-widget-v2.js"
    type="module"
    data-public-key="YOUR_RETELL_PUBLIC_KEY_HERE"
    data-agent-id="YOUR_CHAT_AGENT_ID_HERE"
    data-title="Crimson — Pullman Rotary"
    data-bot-name="Crimson"
    data-color="#1A5276"
    data-open-on-load="true"
    data-show-ai-popup="false"
  ></script>

</body>
</html>
